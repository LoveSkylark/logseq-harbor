# Logseq stack for podman compose.
#
#   sync  - DB sync server (port 8787)
#   web   - Logseq web app served by nginx (http://localhost:8080)
#   mcp   - Logseq desktop app under Xvfb with the MCP HTTP server
#           (http://localhost:12315/mcp)
#
# Build the images first (source is the sibling ../logseq folder):
#   podman compose build
# Start:
#   podman compose up -d
#
# Set DB_SYNC_ADMIN_TOKEN, LOGSEQ_MCP_TOKEN, LOGSEQ_USERNAME, LOGSEQ_PASSWORD and
# LOGSEQ_GRAPH_NAME (and optionally DB_SYNC_BASE_URL) in a .env file next to this file.
# The mcp service signs in with LOGSEQ_USERNAME/LOGSEQ_PASSWORD, downloads LOGSEQ_GRAPH_NAME
# from sync once, and keeps it open. State persists in the mcp-data volume. Do not commit .env.

name: logseq-harbor

services:
  sync:
    build:
      context: ./sync
      network: host
      additional_contexts:
        logseq: ../logseq
    image: localhost/logseq-sync:latest
    container_name: logseq-sync
    restart: unless-stopped
    ports:
      - 8787:8787 # drop this if using a reverse proxy
    environment:
      DB_SYNC_PORT: "8787"
      DB_SYNC_BASE_URL: ${DB_SYNC_BASE_URL:-http://localhost:8787}
      DB_SYNC_DATA_DIR: /app/data
      DB_SYNC_STORAGE_DRIVER: sqlite
      DB_SYNC_ASSETS_DRIVER: filesystem
      DB_SYNC_LOG_LEVEL: info
      DB_SYNC_ADMIN_TOKEN: ${DB_SYNC_ADMIN_TOKEN:?set DB_SYNC_ADMIN_TOKEN in .env}
      COGNITO_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_dtagLnju8
      COGNITO_CLIENT_ID: 69cs1lgme7p8kbgld8n5kseii6
      COGNITO_JWKS_URL: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_dtagLnju8/.well-known/jwks.json
    volumes:
      - logseq-db:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
      network: host
      additional_contexts:
        logseq: ../logseq
    image: localhost/logseq-web:latest
    container_name: logseq-web
    restart: unless-stopped
    ports:
      - 8080:80

  mcp:
    build:
      context: ./mcp
      network: host
      additional_contexts:
        logseq: ../logseq
    image: localhost/logseq-mcp:latest
    container_name: logseq-mcp
    restart: unless-stopped
    shm_size: 1gb
    depends_on:
      - sync
    ports:
      - 12315:12315
    environment:
      LOGSEQ_MCP_ENABLED: "true"
      LOGSEQ_MCP_HOST: 0.0.0.0
      LOGSEQ_MCP_PORT: "12315"
      LOGSEQ_MCP_TOKEN: ${LOGSEQ_MCP_TOKEN:?set LOGSEQ_MCP_TOKEN in .env}
      LOGSEQ_USERNAME: ${LOGSEQ_USERNAME:?set LOGSEQ_USERNAME in .env}
      LOGSEQ_PASSWORD: ${LOGSEQ_PASSWORD:?set LOGSEQ_PASSWORD in .env}
      LOGSEQ_GRAPH_NAME: ${LOGSEQ_GRAPH_NAME:-firstgraph}
      COGNITO_CLIENT_ID: 69cs1lgme7p8kbgld8n5kseii6
      SYNC_SERVER_URL: http://sync:8787
    volumes:
      - mcp-data:/data

volumes:
  logseq-db:
    driver: local
  mcp-data:
    driver: local
